<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DoomShame Control Panel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 350px;
      padding: 20px;
      background: #050811;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .title-badge {
      font-size: 10px;
      font-weight: 800;
      color: #ff2a5f;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      background: rgba(255, 42, 95, 0.12);
      border: 1px solid rgba(255, 42, 95, 0.3);
      padding: 4px 10px;
      border-radius: 12px;
    }
    .icon-btn {
      background: #0d1322;
      border: 1px solid #1e293b;
      color: #94a3b8;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .icon-btn:hover { color: #f8fafc; border-color: #ff2a5f; background: rgba(255,42,95,0.1); }
    .timer-card {
      background: #0d1322;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      position: relative;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .timer-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, #ff2a5f, #7c3aed);
    }
    .timer-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #64748b;
      margin-bottom: 6px;
      font-weight: 700;
    }
    .timer-display {
      font-size: 38px;
      font-weight: 900;
      font-family: 'Courier New', Courier, monospace;
      color: #ffffff;
      letter-spacing: 2px;
      text-shadow: 0 0 15px rgba(255,42,95,0.4);
      margin-bottom: 8px;
    }
    .timer-display.paused-timer { color: #ef4444; text-shadow: 0 0 15px rgba(239,68,68,0.4); }
    .status-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      color: #10b981;
      margin-bottom: 16px;
    }
    .btn-toggle {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 800;
      border: none;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.2s;
    }
    .tracking-on { background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.4); }
    .tracking-on:hover { background: #ef4444; color: #ffffff; }
    .tracking-off { background: linear-gradient(135deg, #10b981, #059669); color: #ffffff; }
    .tracking-off:hover { transform: translateY(-1px); }
    
    .quick-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }
    .btn-action {
      background: #0d1322;
      border: 1px solid #1e293b;
      color: #cbd5e1;
      padding: 10px 4px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }
    .btn-action:hover { background: #1e293b; color: #ffffff; border-color: #ff2a5f; }
    
    .section-title {
      font-size: 11px;
      font-weight: 800;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .demo-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    .btn-demo {
      background: #0d1322;
      border: 1px solid #1e293b;
      color: #ff2a5f;
      padding: 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-demo:hover { background: rgba(255,42,95,0.15); border-color: #ff2a5f; }

    #statusNotice {
      display: none;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #10b981;
      font-size: 11px;
      font-weight: 700;
      padding: 8px 12px;
      border-radius: 8px;
      text-align: center;
      margin-bottom: 12px;
    }

    /* Popup Ambush Modal */
    .popup-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(5, 8, 17, 0.95);
      backdrop-filter: blur(8px);
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      text-align: center;
    }
    .popup-modal-card {
      background: #0d1322;
      border: 2px solid #ff2a5f;
      border-radius: 16px;
      padding: 20px;
      max-width: 300px;
      width: 100%;
      box-shadow: 0 0 30px rgba(255,42,95,0.4);
    }
    .popup-modal-title {
      font-size: 14px; font-weight: 900; color: #ff2a5f; margin-bottom: 10px; text-transform: uppercase;
    }
    .popup-modal-text {
      font-size: 12px; color: #f8fafc; margin-bottom: 14px; line-height: 1.5; font-weight: 600;
    }
    .btn-close-modal {
      width: 100%; padding: 10px; font-size: 11px; font-weight: 800;
      background: #ff2a5f; color: #ffffff; border: none; border-radius: 8px; cursor: pointer; text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="title-badge">DoomShame v2.0</div>
    <button class="icon-btn" id="openOptions" title="Open Trigger Studio">⚙️</button>
  </div>

  <div id="statusNotice"></div>

  <div class="timer-card">
    <div class="timer-label">Active Screen Time</div>
    <div class="timer-display" id="timer">00:00:00</div>
    <div class="status-badge" id="statusBadge">● MONITORING ACTIVE</div>
    <button id="toggleTracking" class="btn-toggle tracking-on">Pause Monitoring</button>
  </div>

  <div class="section-title">Fast Controls</div>
  <div class="quick-actions">
    <button class="btn-action" id="set55Secs">⏱️ Set 55s</button>
    <button class="btn-action" id="add30Secs">⏩ +30s</button>
    <button class="btn-action" id="resetTimer">🔄 Reset</button>
  </div>

  <div class="section-title">Instant Demo Triggers</div>
  <div class="demo-grid">
    <button class="btn-demo" id="demoTrigger1h">⚡ 1 Min Roast</button>
    <button class="btn-demo" id="demoTrigger2h">⚡ 2 Min Roast</button>
    <button class="btn-demo" id="demoTrigger1">⚡ 6h7m Roast</button>
    <button class="btn-demo" id="demoTrigger2">⚡ 8h Roast</button>
  </div>

  <!-- Coward Ambush Popup Modal -->
  <div class="popup-modal" id="popupRoastModal">
    <div class="popup-modal-card">
      <div class="popup-modal-title" id="popupRoastTitle">COWARD AMBUSH!</div>
      <div id="popupMediaContainer"></div>
      <div class="popup-modal-text" id="popupRoastText">"PAUSED ALREADY?!"</div>
      <button class="btn-close-modal" id="closePopupRoast">Dismiss</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
