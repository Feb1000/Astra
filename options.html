<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DoomShame - Custom Trigger Studio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #050811;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      padding: 40px 20px;
      max-width: 900px;
      margin: 0 auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid #1e293b;
    }
    h1 {
      font-size: 24px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: -0.5px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      background: rgba(255, 42, 95, 0.15);
      border: 1px solid rgba(255, 42, 95, 0.4);
      color: #ff2a5f;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 20px;
      letter-spacing: 1px;
    }
    .subtext {
      color: #94a3b8;
      font-size: 14px;
      margin-top: 4px;
    }
    .header-actions {
      display: flex;
      gap: 10px;
    }
    button {
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #ff2a5f, #d91b48);
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(255, 42, 95, 0.4);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 42, 95, 0.6);
    }
    .btn-secondary {
      background: #0d1322;
      border: 1px solid #1e293b;
      color: #cbd5e1;
    }
    .btn-secondary:hover {
      background: #1e293b;
      color: #ffffff;
      border-color: #334155;
    }
    .btn-danger {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #ef4444;
    }
    .btn-danger:hover {
      background: #ef4444;
      color: #ffffff;
    }

    .trigger-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 30px;
    }
    .card {
      background: #0d1322;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      display: grid;
      grid-template-columns: 1fr 1fr 2fr 2fr;
      gap: 16px;
      align-items: start;
      position: relative;
    }
    .card::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0; width: 4px;
      background: #ff2a5f;
      border-top-left-radius: 16px;
      border-bottom-left-radius: 16px;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 800;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    input[type="number"], input[type="text"] {
      width: 100%;
      background: #050811;
      border: 1px solid #1e293b;
      border-radius: 8px;
      color: #f8fafc;
      padding: 10px 12px;
      font-size: 13px;
      font-weight: 600;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="number"]:focus, input[type="text"]:focus {
      border-color: #ff2a5f;
    }
    .card-actions {
      grid-column: span 4;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 8px;
      padding-top: 16px;
      border-top: 1px solid rgba(255,255,255,0.05);
    }
    
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #10b981;
      color: #ffffff;
      padding: 12px 20px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 13px;
      box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4);
      display: none;
      z-index: 1000;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>DOOMSHAME <span class="badge">TRIGGER STUDIO v2.0</span></h1>
      <div class="subtext">Configure custom screen time thresholds, soundboards, and roast memes.</div>
    </div>
    <div class="header-actions">
      <button class="btn-secondary" id="resetTimerBtn">🔄 Reset Timer (00:00)</button>
      <button class="btn-secondary" id="resetDefaultsBtn">⚠️ Restore Defaults</button>
      <button class="btn-secondary" id="addTriggerBtn">➕ Add Trigger</button>
      <button class="btn-primary" id="saveBtn">💾 Save Rules</button>
    </div>
  </header>

  <div class="trigger-list" id="triggerList"></div>

  <div id="toast">Settings Saved Successfully!</div>

  <script src="options.js"></script>
</body>
</html>
